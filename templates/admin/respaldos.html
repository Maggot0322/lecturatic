{% extends "base.html" %}
{% block titulo %}Respaldos - LECTURATIC{% endblock %}
{% block contenido %}

<h2 class="mb-4"><i class="bi bi-shield-check"></i> Respaldo y Restauración de la Base de Datos</h2>

<div class="card card-suave p-4 mb-4">
  <form method="POST" action="{{ url_for('admin_crear_respaldo') }}">
    <button type="submit" class="btn btn-lecturatic"><i class="bi bi-cloud-arrow-up"></i> Crear nuevo respaldo ahora</button>
  </form>
</div>

<div class="card card-suave p-4">
  <h5><i class="bi bi-archive"></i> Respaldos disponibles</h5>
  <table class="table">
    <thead><tr><th>Archivo</th><th>Acción</th></tr></thead>
    <tbody>
      {% for archivo in archivos %}
      <tr>
        <td>{{ archivo }}</td>
        <td>
          <form method="POST" action="{{ url_for('admin_restaurar_respaldo', nombre_archivo=archivo) }}"
                onsubmit="return confirmarAccion('¿Restaurar la base de datos desde este respaldo? Se reemplazarán los datos actuales.');">
            <button type="submit" class="btn btn-sm btn-outline-warning"><i class="bi bi-arrow-counterclockwise"></i> Restaurar</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="2" class="text-center text-muted">Aún no se han creado respaldos.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
